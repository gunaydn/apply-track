version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - node -v
        - npm -v
        # Bust stale Amplify cache that may omit Angular CLI (devDependency)
        - rm -rf node_modules
        # Amplify sets NODE_ENV=production which skips devDependencies by default
        - npm ci --include=dev
    build:
      commands:
        - npm run build -- --configuration production
  artifacts:
    baseDirectory: dist/apply-track
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
