version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify image does not have Node 18 preinstalled (nvm use 18 fails).
        # Node 20 is available and satisfies Angular 15 engines (>=18.10).
        - nvm install 20
        - nvm use 20
        - node -v
        - npm -v
        - rm -rf node_modules
        # Amplify sets NODE_ENV=production; force Angular CLI (devDependency)
        - NPM_CONFIG_PRODUCTION=false npm ci
    build:
      commands:
        - npm run build -- --configuration production
  artifacts:
    baseDirectory: dist/apply-track
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
