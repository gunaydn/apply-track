version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Do not use nvm install/use — Amplify image has no Node 18, and
        # nvm install 20 fails while downloading from nodejs.org.
        # Use the build image default Node (supports Angular 15 engines).
        - node -v
        - npm -v
        - rm -rf node_modules
        # Amplify sets NODE_ENV=production; force Angular CLI (devDependency)
        - NPM_CONFIG_PRODUCTION=false npm ci
    build:
      commands:
        - npm run build -- --configuration production
  artifacts:
    baseDirectory: dist/apply-track
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
