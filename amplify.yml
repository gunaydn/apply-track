version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use Amplify image's preinstalled Node 18 (do not nvm install — can fail on AL2)
        - nvm use 18
        - node -v
        # Drop stale cache that may omit Angular CLI when NODE_ENV=production
        - rm -rf node_modules
        # Amplify sets NODE_ENV=production; force install of Angular CLI (devDependency)
        - NPM_CONFIG_PRODUCTION=false npm ci
    build:
      commands:
        - npm run build -- --configuration production
  artifacts:
    baseDirectory: dist/apply-track
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
