version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node -v
        - npm -v
        - npm ci

    build:
      commands:
        - npm run build -- --configuration production

  artifacts:
    baseDirectory: dist/apply-track
    files:
      - "**/*"

  cache:
    paths:
      - ~/.npm/**/*
