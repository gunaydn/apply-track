version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify default Node is v22; skip nvm (install/use were failing).
        - node -v
        - npm -v
        - rm -rf node_modules
        # --include=dev is required under NODE_ENV=production (Angular CLI is a devDependency)
        - npm ci --include=dev
    build:
      commands:
        - npm run build -- --configuration production
  artifacts:
    baseDirectory: dist/apply-track
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
