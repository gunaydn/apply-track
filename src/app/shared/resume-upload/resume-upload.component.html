<div>
  <label
    for="resume-upload-input"
    class="flex min-h-[200px] cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50 px-6 text-center transition hover:border-slate-400 hover:bg-slate-100"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="mb-4 h-10 w-10 text-slate-400"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M12 3v12" />
      <path d="m7 8 5-5 5 5" />
      <path d="M5 21h14" />
    </svg>

    <span class="text-sm font-semibold text-slate-800"> Select your CV </span>

    <span class="mt-1 text-xs text-slate-500">
      PDF files only, maximum 5 MB
    </span>

    <input
      id="resume-upload-input"
      type="file"
      accept=".pdf,application/pdf"
      class="hidden"
      [disabled]="isUploading"
      (change)="onFileSelected($event)"
    />
  </label>

  <!-- SELECTED FILE -->
  <div
    *ngIf="selectedFile"
    class="mt-4 flex items-center gap-3 rounded-xl border border-slate-200 bg-white p-3"
  >
    <div
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-red-50 text-xs font-semibold text-red-600"
    >
      PDF
    </div>

    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-medium text-slate-900">
        {{ selectedFile.name }}
      </p>

      <p class="text-xs text-slate-500">
        {{ selectedFile.size / 1024 / 1024 | number : "1.2-2" }}
        MB
      </p>
    </div>

    <button
      type="button"
      (click)="removeSelectedFile()"
      [disabled]="isUploading"
      class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-xl text-slate-400 transition hover:bg-red-50 hover:text-red-600 disabled:cursor-not-allowed disabled:opacity-50"
      aria-label="Remove selected CV"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </div>

  <!-- ERROR -->
  <p *ngIf="error" class="mt-3 text-sm font-medium text-red-600">
    {{ error }}
  </p>
</div>
