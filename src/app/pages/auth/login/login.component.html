<div
  class="min-h-screen bg-slate-100 text-slate-900 relative overflow-hidden flex items-center justify-center px-4"
>
  <!-- Background Effects -->
  <div class="absolute inset-0">
    <div
      class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(148,163,184,0.28),transparent_35%),radial-gradient(circle_at_bottom_right,rgba(203,213,225,0.65),transparent_40%),linear-gradient(135deg,#f8fafc_0%,#f1f5f9_50%,#e2e8f0_100%)]"
    ></div>

    <div
      class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-white/70 blur-3xl"
    ></div>

    <div
      class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full bg-slate-300/40 blur-3xl"
    ></div>
  </div>

  <!-- Auth Card -->
  <div
    class="relative z-10 w-full max-w-md rounded-[2rem] border border-white bg-white/90 backdrop-blur-xl shadow-2xl shadow-slate-300/40 p-6 sm:p-8"
  >
    <!-- Logo -->
    <div class="flex items-center justify-between mb-8">
      <a routerLink="/" class="flex items-center gap-3">
        <img
          src="assets/logo.png"
          alt=""
          class="w-10 h-10 object-contain"
          width="40"
          height="40"
        />

        <div>
          <p class="text-sm font-semibold tracking-wide text-slate-900">
            ApplyTrack
          </p>
          <p class="text-xs text-slate-500">Job Application Tracker</p>
        </div>
      </a>

      <a
        routerLink="/auth/register"
        class="text-sm text-slate-500 hover:text-slate-900 transition"
      >
        Sign up
      </a>
    </div>

    <!-- Title -->
    <div class="mb-8">
      <p class="uppercase tracking-[0.22em] text-xs text-slate-400 mb-3">
        Welcome back
      </p>

      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-slate-950">
        Log in to your account
      </h1>

      <p class="mt-3 text-sm text-slate-500 leading-6">
        Track your applications, interviews and offers from one clean dashboard.
      </p>
    </div>

    <!-- Form -->
    <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          Email
        </label>

        <div
          class="h-12 rounded-2xl bg-slate-50 border border-slate-200 px-4 flex items-center gap-3 focus-within:border-slate-400 focus-within:bg-white focus-within:ring-4 focus-within:ring-slate-100 transition overflow-hidden"
        >
          <input
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
            class="w-full h-full bg-transparent appearance-none outline-none border-0 text-sm text-slate-900 placeholder:text-slate-400 focus:ring-0"
          />

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-slate-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M4 4h16v16H4z" />
            <path d="m22 6-10 7L2 6" />
          </svg>
        </div>

        <p
          *ngIf="
            loginForm.get('email')?.touched && loginForm.get('email')?.invalid
          "
          class="mt-2 text-xs text-red-500"
        >
          Please enter a valid email.
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          Password
        </label>

        <div
          class="h-12 rounded-2xl bg-slate-50 border border-slate-200 px-4 flex items-center gap-3 focus-within:border-slate-400 focus-within:bg-white focus-within:ring-4 focus-within:ring-slate-100 transition overflow-hidden"
        >
          <input
            type="password"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="w-full h-full bg-transparent appearance-none outline-none border-0 text-sm text-slate-900 placeholder:text-slate-400 focus:ring-0"
          />

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-slate-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </div>

        <p
          *ngIf="
            loginForm.get('password')?.touched &&
            loginForm.get('password')?.invalid
          "
          class="mt-2 text-xs text-red-500"
        >
          Password is required.
        </p>
      </div>

      <!-- Error Message -->
      <p *ngIf="errorMessage" class="text-sm text-red-500">
        {{ errorMessage }}
      </p>

      <!-- Actions -->
      <div class="flex items-center justify-between pt-1">
        <button
          type="button"
          class="text-sm text-slate-500 hover:text-slate-900 transition"
        >
          Forgot password?
        </button>
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full h-12 rounded-2xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-700 transition shadow-lg shadow-slate-300 disabled:opacity-60 disabled:cursor-not-allowed"
      >
        {{ isLoading ? "Logging in..." : "Log in" }}
      </button>
    </form>

    <!-- Footer -->
    <p class="mt-8 text-center text-sm text-slate-500">
      Don't have an account?
      <a
        routerLink="/auth/register"
        class="text-slate-900 font-semibold hover:text-slate-600 transition"
      >
        Create account
      </a>
    </p>
  </div>
</div>
