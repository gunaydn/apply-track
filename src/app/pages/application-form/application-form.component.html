<div class="max-w-3xl mx-auto">
  <div class="mb-5 mt-4 flex items-start justify-between gap-4">
    <div>
      <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 leading-tight">
        {{ isEditMode ? "Edit Application" : "Add Application" }}
      </h2>

      <p class="text-sm sm:text-base text-slate-500 mt-1 max-w-md">
        {{
          isEditMode
            ? "Update your application details."
            : "Track a new job application."
        }}
      </p>
    </div>

    <button
      type="button"
      (click)="goBackToLastPage()"
      class="shrink-0 inline-flex items-center justify-center w-10 h-10 rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition"
      aria-label="Go back"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M19 12H5" />
        <path d="M12 19l-7-7 7-7" />
      </svg>
    </button>
  </div>

  <form
    [formGroup]="applicationForm"
    (ngSubmit)="onSubmit()"
    class="bg-white rounded-2xl shadow p-6 space-y-5"
  >
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Company Name
        </label>

        <input
          type="text"
          formControlName="companyName"
          placeholder="Example: Trendyol"
          class="w-full rounded-xl border border-slate-300 px-4 py-2 outline-none focus:ring-2 focus:ring-slate-800"
        />

        <p
          *ngIf="
            applicationForm.get('companyName')?.touched &&
            applicationForm.get('companyName')?.invalid
          "
          class="text-sm text-red-500 mt-1"
        >
          Company name is required.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Position
        </label>

        <input
          type="text"
          formControlName="position"
          placeholder="Example: Frontend Developer"
          class="w-full rounded-xl border border-slate-300 px-4 py-2 outline-none focus:ring-2 focus:ring-slate-800"
        />

        <p
          *ngIf="
            applicationForm.get('position')?.touched &&
            applicationForm.get('position')?.invalid
          "
          class="text-sm text-red-500 mt-1"
        >
          Position is required.
        </p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Status
        </label>

        <select
          formControlName="status"
          class="w-full rounded-xl border border-slate-300 px-4 py-2 outline-none focus:ring-2 focus:ring-slate-800"
        >
          <option *ngFor="let status of statuses" [value]="status">
            {{ status }}
          </option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Application Date
        </label>

        <input
          type="date"
          formControlName="applicationDate"
          class="w-full rounded-xl border border-slate-300 px-4 py-2 outline-none focus:ring-2 focus:ring-slate-800"
        />

        <p
          *ngIf="
            applicationForm.get('applicationDate')?.touched &&
            applicationForm.get('applicationDate')?.invalid
          "
          class="text-sm text-red-500 mt-1"
        >
          Application date is required.
        </p>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">
        Location
      </label>

      <input
        type="text"
        formControlName="location"
        placeholder="Example: Remote / Istanbul / Izmir"
        class="w-full rounded-xl border border-slate-300 px-4 py-2 outline-none focus:ring-2 focus:ring-slate-800"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">
        Job URL
      </label>

      <input
        type="url"
        formControlName="jobUrl"
        placeholder="https://..."
        class="w-full rounded-xl border border-slate-300 px-4 py-2 outline-none focus:ring-2 focus:ring-slate-800"
      />
    </div>

    <!-- FOLLOW-UP -->
    <div
      class="rounded-2xl border border-slate-200 bg-slate-50/60 p-4 space-y-4"
    >
      <div>
        <h3 class="text-sm font-semibold text-slate-900">Follow-up</h3>
        <p class="text-xs text-slate-500 mt-1">
          Set a reminder date and note for the next step.
        </p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">
            Follow-up Date
          </label>

          <input
            type="date"
            formControlName="followUpDate"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2 outline-none focus:ring-2 focus:ring-slate-800"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">
            Follow-up Note
          </label>

          <input
            type="text"
            formControlName="followUpNote"
            placeholder="Example: Send an email to HR"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2 outline-none focus:ring-2 focus:ring-slate-800"
          />
        </div>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">
        Notes
      </label>

      <textarea
        rows="4"
        formControlName="notes"
        placeholder="Add interview notes, recruiter info, next steps..."
        class="w-full rounded-xl border border-slate-300 px-4 py-2 outline-none focus:ring-2 focus:ring-slate-800 resize-none"
      ></textarea>
    </div>

    <div class="flex items-center justify-between gap-3">
      <button
        type="button"
        (click)="goBack()"
        class="px-5 py-2 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100"
      >
        Cancel
      </button>

      <button
        type="submit"
        class="px-5 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-700"
      >
        {{ isEditMode ? "Update Application" : "Save Application" }}
      </button>
    </div>
  </form>
</div>
